<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220"><title>School</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#142137;--muted:#91a1bb;--mint:#75e8c0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f6ff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:760px;margin:auto;padding:28px 18px 48px}.brand{font-size:30px;font-weight:800;letter-spacing:-1px}.brand span{color:var(--mint)}
h1{font-size:25px;margin:38px 0 18px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--panel);border:1px solid #263852;color:#fff;border-radius:16px;padding:18px 14px;text-align:left;font-size:16px;cursor:pointer}
.mode small{display:block;color:var(--muted);margin-top:8px;line-height:1.4}.mode.active{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint) inset}
label{display:block;font-weight:650;margin:26px 0 10px}textarea{width:100%;min-height:145px;resize:vertical;background:#101b2d;border:1px solid #30425d;border-radius:14px;padding:15px;color:white;font:inherit;outline:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.upload,.send{border:0;border-radius:13px;padding:14px 16px;font-weight:700;cursor:pointer}
.upload{background:#1b2b43;color:#dce7fa}.send{background:var(--mint);color:#092018;width:100%;margin-top:18px;font-size:16px}
input[type=file]{display:none}.toggle{display:flex;align-items:center;gap:10px;color:#dce7fa;margin-top:20px}.toggle input{accent-color:var(--mint);width:18px;height:18px}
#fileName{color:var(--muted);font-size:13px;margin-top:8px}.result{white-space:pre-wrap;background:#101b2d;border:1px solid #30425d;border-radius:14px;padding:16px;margin-top:22px;line-height:1.6;display:none}.hint{color:var(--muted);font-size:13px;line-height:1.5;margin-top:18px}
button:disabled{opacity:.55;cursor:wait}
@media(max-width:420px){main{padding:22px 15px}.mode{padding:15px 12px}}
</style></head>
<body><main>
<div class="brand">school<span>.</span></div>
<h1>Чем займёмся?</h1>
<div class="modes">
<button class="mode active" data-mode="tasks">▤ Обычные задачи<small>Решение школьных заданий</small></button>
<button class="mode" data-mode="graph">⌁ Графики<small>Функции и построения</small></button>
</div>
<label for="prompt">Твоё задание</label>
<textarea id="prompt" placeholder="Напиши вопрос или условие задачи..."></textarea>
<div class="actions">
<label class="upload" for="photo" style="margin:0;cursor:pointer">＋ Прикрепить фото</label>
<input id="photo" type="file" accept="image/png,image/jpeg,image/webp">
</div><div id="fileName"></div>
<label class="toggle"><input id="detail" type="checkbox"> Подробное решение по шагам</label>
<button class="send" id="send">Отправить задание ↑</button>
<div class="result" id="result"></div>
<p class="hint">Бесплатный режим зависит от доступности и лимитов выбранной модели. Не отправляй личные данные.</p>
</main>
<script>
let mode="tasks", imageData="";
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.mode;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x===b));}));
document.getElementById("photo").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024){alert("Фото должно быть меньше 8 МБ");e.target.value="";return;}const r=new FileReader();r.onload=()=>{imageData=r.result;document.getElementById("fileName").textContent="Фото прикреплено: "+f.name};r.readAsDataURL(f);});
document.getElementById("send").addEventListener("click",async()=>{const prompt=document.getElementById("prompt").value.trim();if(!prompt&&!imageData){alert("Напиши задание или прикрепи фото.");return;}
const btn=document.getElementById("send"),out=document.getElementById("result");btn.disabled=true;btn.textContent="Решаю…";out.style.display="block";out.textContent="Подготавливаю ответ…";
try{const r=await fetch("/api/solve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,mode,detail:document.getElementById("detail").checked,image:imageData||null})});const data=await r.json();out.textContent=data.answer||data.error||"Не удалось получить ответ.";}
catch(e){out.textContent="Не удалось подключиться к серверу. Проверь подключение и попробуй ещё раз.";}
finally{btn.disabled=false;btn.textContent="Отправить задание ↑";}
});
</script></body></html>
